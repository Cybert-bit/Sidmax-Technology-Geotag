<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" role="img" aria-labelledby="title description">
  <title id="title">Sample captured GPS-stamped photo</title>
  <desc id="description">Illustrative mountain city photo with a Sidmax Pro-style GPS map and location stamp across the bottom.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#94c9d1"/>
      <stop offset=".5" stop-color="#d8d6b9"/>
      <stop offset="1" stop-color="#e79f66"/>
    </linearGradient>
    <linearGradient id="haze" x2="0" y2="1">
      <stop stop-color="#f7c58d" stop-opacity=".05"/>
      <stop offset="1" stop-color="#f7c58d" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="valley" x2="0" y2="1">
      <stop stop-color="#527466"/>
      <stop offset="1" stop-color="#263c38"/>
    </linearGradient>
    <linearGradient id="foreground" x2="0" y2="1">
      <stop stop-color="#47574b"/>
      <stop offset="1" stop-color="#172c2c"/>
    </linearGradient>
    <linearGradient id="card" x2="0" y2="1">
      <stop stop-color="#111820" stop-opacity=".83"/>
      <stop offset="1" stop-color="#080d12" stop-opacity=".91"/>
    </linearGradient>
    <linearGradient id="map" x2="1" y2="1">
      <stop stop-color="#667c5d"/>
      <stop offset=".48" stop-color="#43594d"/>
      <stop offset="1" stop-color="#293f3f"/>
    </linearGradient>
    <filter id="softShadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="18"/>
      <feColorMatrix values=".25 0 0 0 .35  0 .25 0 0 .35  0 0 .25 0 .35  0 0 0 .10 0"/>
    </filter>
    <clipPath id="photoClip"><rect width="900" height="1350"/></clipPath>
    <clipPath id="mapClip"><rect x="24" y="1060" width="255" height="255" rx="15"/></clipPath>
  </defs>

  <g clip-path="url(#photoClip)">
    <rect width="900" height="1350" fill="url(#sky)"/>
    <circle cx="685" cy="302" r="86" fill="#ffe3a6" opacity=".83"/>
    <circle cx="685" cy="302" r="123" fill="#ffe3a6" opacity=".16"/>

    <path d="M0 565 115 440 189 489 318 329 406 432 533 279 647 420 756 315 900 456V790H0Z" fill="#6c8780" opacity=".66"/>
    <path d="m248 415 70-86 42 50-35-18-32 35-20-8-25 27Zm245-76 40-60 48 63-29-15-21 12-18-17-16 23Zm232 14 31-38 50 53-32-15-23 14-14-14-20 15Z" fill="#f0e9d1" opacity=".56"/>
    <path d="M0 620 131 500l93 61 128-127 117 120 132-145 111 121 105-91 83 64v389H0Z" fill="#536d66"/>
    <path d="M0 705q130-108 271-66t265-48q157-103 364 5v358H0Z" fill="url(#haze)"/>

    <path d="M0 720q116-86 236-40 101 39 194-19 116-74 240-3 116 68 230 3v348H0Z" fill="url(#valley)"/>
    <path d="M-20 860q150-108 285-38 92 48 186-31 124-103 240-10 108 88 229 5v252H-20Z" fill="#314d43"/>

    <g fill="#263b35" opacity=".9">
      <path d="m96 893 36-119 37 119h-22l31 58h-90l31-58z"/>
      <path d="m211 844 28-93 30 93h-18l25 48h-73l25-48z"/>
      <path d="m736 846 34-111 35 111h-21l29 53h-85l29-53z"/>
      <path d="m822 911 29-98 31 98h-18l25 47h-74l25-47z"/>
    </g>

    <path d="M0 953q111-55 228 6 100 52 204 0 88-45 196-11 120 39 272-12v414H0Z" fill="url(#foreground)"/>
    <path d="M0 1079q123-68 249-8 120 57 235 3 159-75 416 8v268H0Z" fill="#1b3030" opacity=".83"/>

    <g opacity=".85">
      <path d="M52 1008h72v-43l-36-28-36 28z" fill="#a65f49"/><path d="M44 966l44-35 44 35z" fill="#713f39"/><rect x="64" y="978" width="12" height="19" fill="#e5c997"/><rect x="96" y="978" width="14" height="12" fill="#d9d6bd"/>
      <path d="M139 1022h87v-52l-43-34-44 34z" fill="#d09a67"/><path d="m130 975 53-43 53 43z" fill="#745246"/><rect x="155" y="984" width="16" height="24" fill="#e3d5b5"/><rect x="190" y="984" width="19" height="15" fill="#8eac9b"/>
      <path d="M676 1016h89v-57l-45-34-44 34z" fill="#b87953"/><path d="m667 964 53-44 54 44z" fill="#65483d"/><rect x="694" y="975" width="18" height="25" fill="#ddc89b"/><rect x="728" y="975" width="20" height="16" fill="#a8b8a0"/>
      <path d="M774 1045h88v-53l-44-34-44 34z" fill="#c49362"/><path d="m765 998 53-43 53 43z" fill="#6c5141"/><rect x="790" y="1009" width="17" height="25" fill="#d4c7a0"/><rect x="825" y="1008" width="20" height="15" fill="#9eac94"/>
    </g>

    <path d="M0 1148q102-67 206-17 95 46 184 17 105-34 202 1 141 50 308-6v207H0Z" fill="#172b2b" opacity=".88"/>
    <rect width="900" height="1350" filter="url(#grain)" opacity=".13"/>

    <g filter="url(#softShadow)">
      <rect x="24" y="1060" width="852" height="255" rx="15" fill="url(#card)" stroke="#ffffff" stroke-opacity=".65" stroke-width="2"/>

      <g clip-path="url(#mapClip)">
        <rect x="24" y="1060" width="255" height="255" fill="url(#map)"/>
        <path d="M21 1090 105 1114 160 1080 281 1109M16 1158l72-18 62 32 135-40M35 1226l70-25 55 25 118-47M86 1053l-10 79 28 61-23 128M183 1054l22 62-25 57 15 148" fill="none" stroke="#adbb8b" stroke-opacity=".48" stroke-width="3"/>
        <path d="M28 1194 105 1169l74 19 96-53M43 1080l70 49 73-35 88 36" fill="none" stroke="#d2c6a4" stroke-opacity=".72" stroke-width="7"/>
        <path d="M29 1194 105 1169l74 19 96-53" fill="none" stroke="#e7d8b8" stroke-opacity=".95" stroke-width="2"/>
        <path d="M45 1260q38-30 78 0t84-2q26-24 67-6v63H45Z" fill="#344d50" opacity=".72"/>
        <g transform="translate(153 1174)">
          <ellipse cx="0" cy="16" rx="9" ry="4" fill="#000" opacity=".36"/>
          <path d="M0 13C-3 7-12-1-12-9a12 12 0 1 1 24 0c0 8-9 16-12 22Z" fill="#ea4335"/>
          <circle cy="-9" r="4" fill="#fff"/>
        </g>
        <text x="35" y="1300" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" opacity=".94">Google</text>
      </g>

      <path d="M279 1060v255M279 1167h597" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
      <g font-family="Arial,sans-serif">
        <text x="300" y="1093" font-size="18" font-weight="700" fill="#58a6ff">📷  Sidmax Technology</text>
        <text x="300" y="1127" font-size="24" font-weight="700" fill="#fff">Baguio City, Benguet 🇵🇭</text>
        <text x="300" y="1155" font-size="17" fill="#fff" opacity=".92">Philippines</text>
        <text x="300" y="1197" font-size="17" fill="#fff" opacity=".9">Session Road, Baguio City, Benguet</text>
        <text x="300" y="1227" font-size="16" font-family="monospace" fill="#fff" opacity=".86">Lat 16.4023°  |  Long 120.5960°</text>
        <text x="300" y="1257" font-size="16" fill="#fff" opacity=".86">Friday, 09/10/2026 08:24 AM GMT +08:00</text>
        <text x="300" y="1287" font-size="16" fill="#f6d27e" opacity=".96">☁  22°C  Cloudy  |  Wind 8 km/h</text>
      </g>
    </g>
  </g>
</svg>